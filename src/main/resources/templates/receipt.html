<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Receipt</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
          background-color: #f4f7fa;
          font-family: 'Roboto', sans-serif;
          margin: 0;
          padding: 0;
        }
        .receipt {
          max-width: 600px;
          background: #ffffff;
          margin: 40px auto;
          padding: 30px;
          border-radius: 8px;
          box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .receipt h1 {
          margin-top: 0;
          font-size: 24px;
          color: #2c3e50;
          text-align: center;
        }
        .receipt .meta {
          display: flex;
          justify-content: space-between;
          margin-bottom: 20px;
        }
        .receipt .meta div {
          flex: 1;
        }
        .receipt .meta .label {
          font-size: 14px;
          color: #7f8c8d;
        }
        .receipt .meta .value {
          font-size: 16px;
          color: #2c3e50;
          font-weight: 500;
        }
        .items {
          margin-top: 20px;
        }
        .items h2 {
          font-size: 18px;
          color: #34495e;
          border-bottom: 2px solid #ecf0f1;
          padding-bottom: 8px;
          margin-bottom: 12px;
        }
        .item-row {
          display: flex;
          justify-content: space-between;
          padding: 10px 0;
          border-bottom: 1px solid #ecf0f1;
        }
        .item-row:last-child {
          border-bottom: none;
        }
        .item-name { font-size: 16px; color: #2c3e50; }
        .item-price { font-size: 16px; color: #2c3e50; }
        .total {
          display: flex;
          justify-content: space-between;
          padding: 15px 0;
          border-top: 2px solid #bdc3c7;
          font-size: 18px;
          font-weight: 700;
          color: #2c3e50;
        }
        .footer {
          text-align: center;
          margin-top: 30px;
          font-size: 14px;
          color: #95a5a6;
        }
        .status {
          padding: 4px 8px;
          border-radius: 4px;
          font-weight: 500;
          display: inline-block;
        }
        .status-completed { background-color: #27ae60; color: #ecf0f1; }
        .status-pending { background-color: #f39c12; color: #ecf0f1; }
        .status-failed { background-color: #e74c3c; color: #ecf0f1; }
    </style>
</head>
<body>
<div class="receipt">
    <h1>Transaction Receipt</h1>
    <div class="meta">
        <div>
            <div class="label">Transaction ID</div>
            <div class="value" th:text="${transaction.id}"></div>
        </div>
        <div>
            <div class="label">Date</div>
            <div class="value" th:text="${#dates.format(transaction.createdAt,'MMM dd, yyyy HH:mm')}"></div>
        </div>
    </div>
    <div class="meta">
        <div>
            <div class="label">Email</div>
            <div class="value" th:text="${transaction.customerEmail}"></div>
        </div>
        <div>
            <div class="label">Status</div>
            <div class="value">
          <span class="status" th:classappend="${transaction.status == 'COMPLETED'}? ' status-completed' : (${transaction.status == 'PENDING'}? ' status-pending':' status-failed')"
                th:text="${transaction.status}"></span>
            </div>
        </div>
    </div>

    <div class="items">
        <h2>Purchased Items</h2>
        <div th:each="item : ${items}" class="item-row">
            <div class="item-name" th:text="${item.split(' \(')[0]}">Item Name</div>
            <div class="item-price" th:text="${item.split(' \(')[1].replace(')','')}">$0.00</div>
        </div>
    </div>

    <div class="total">
        <div>Total</div>
        <div th:text="'\$' + ${total}">$0.00</div>
    </div>

    <div class="footer">
        Thank you for your purchase!<br>
        Contact support if you have any questions.
    </div>
</div>
</body>
</html>
