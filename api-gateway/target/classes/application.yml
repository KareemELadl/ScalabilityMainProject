server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/user/**
        - id: search-service
          uri: http://localhost:8082
          predicates:
            - Path=/search/**
        - id: transaction-service
          uri: http://localhost:8083
          predicates:
            - Path=/transaction/**
        - id: merchant-service
          uri: http://localhost:8084
          predicates:
            - Path=/merchant/**
